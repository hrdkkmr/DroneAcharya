vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>
#da-guide{position:fixed;left:50%;top:16px;transform:translateX(-50%);max-width:720px;width:90%;color:#e8eaec;font:14px/1.5 system-ui,Segoe UI,Arial,sans-serif;text-align:left;background:rgba(14,17,20,.92);border:1px solid #3d454d;border-left:3px solid #ffc740;padding:14px 18px;z-index:10}
#da-guide h1{font-size:18px;margin:0 0 4px;color:#fff;letter-spacing:.04em}
#da-guide p{margin:2px 0 8px;color:#b4bec8}
#da-guide b{color:#ffc740;font-weight:600}
#da-guide ul{margin:0;padding-left:18px}
</style>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var g = document.createElement('div');
  g.id = 'da-guide';
  g.innerHTML = '<h1>DRONEACHARYA — loading…</h1>' +
    '<p>Synthetic drone flight and threat-detection trainer (prototype). About 40 MB; the first load can take a minute. Sound starts after your first click or key press. Use a desktop browser with a mouse and keyboard.</p>' +
    '<ul><li><b>Flight:</b> Space / C climb / descend · W A S D move · Q / E turn · V camera · Esc pause</li>' +
    '<li><b>Threat detection:</b> left-click a contact · mouse wheel to choose · right-click to confirm · Tab / ↑↓ / Enter on the keyboard · Esc pause</li></ul>';
  document.body.appendChild(g);
  var poll = setInterval(function () {
    if (!document.getElementById('status')) {
      g.remove();
      clearInterval(poll);
    }
  }, 300);
});
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
